name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  mac-install:
    # Apple Silicon runners: install from the zip exactly as the photographer would, then open the app the way
    # Finder does and use it. macOS 26 is what a new MacBook ships with.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build the zip
        run: python3 scripts/build_zip.py

      - name: Check the installer app in the zip
        run: |
          mkdir -p "$RUNNER_TEMP/Downloads"
          ditto -x -k dist/PhotoCull-mac.zip "$RUNNER_TEMP/Downloads"
          ls -la "$RUNNER_TEMP/Downloads/Photo Cull"
          INST="$RUNNER_TEMP/Downloads/Photo Cull/Install Photo Cull.app"
          codesign --verify --verbose "$INST"
          lipo -archs "$INST/Contents/MacOS/applet" | grep -qw arm64 || { echo "installer is not native arm64"; exit 1; }
          test -f "$INST/Contents/Resources/payload/install-mac.sh"
          test -f "$INST/Contents/Resources/payload/app/photocull/server.py"

      - name: Install (what the installer app and the Update button run)
        env:
          PHOTOCULL_APPS_DIR: ${{ runner.temp }}/Applications
          PHOTOCULL_NO_OPEN: "1"
          PHOTOCULL_ZIP: file://${{ github.workspace }}/dist/PhotoCull-mac.zip
        run: |
          /usr/bin/time -l bash install.sh 2>&1 | tail -40
          APP="$RUNNER_TEMP/Applications/Photo Cull.app"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --verbose "$APP"
          sw_vers
          # Must be a native Apple Silicon app: these Macs have Rosetta installed, so a script or Intel-only app
          # would open here but ask her Mac (no Rosetta) to install it.
          EXE="$APP/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist")"
          file "$EXE"
          lipo -archs "$EXE" | grep -qw arm64 || { echo "launcher is not native arm64"; exit 1; }
          test "$(plutil -extract LSUIElement raw "$APP/Contents/Info.plist")" = true
          du -sh "$HOME/Library/Application Support/Photo Cull"

      - name: Make a sample shoot (public-domain and CC0 photos only)
        run: |
          "$HOME/Library/Application Support/Photo Cull/venv/bin/python" tests/make_samples.py "$RUNNER_TEMP/shoot" --raw
          "$HOME/Library/Application Support/Photo Cull/venv/bin/python" tests/make_samples.py "$RUNNER_TEMP/speed" --big 90
          "$HOME/Library/Application Support/Photo Cull/venv/bin/python" - <<'EOF'
          import os, sys
          sys.path.insert(0, os.path.expanduser("~/Library/Application Support/Photo Cull/app"))
          from photocull import photos
          shoot = os.path.join(os.environ["RUNNER_TEMP"], "shoot")
          data, _, _ = photos._raw_preview(os.path.join(shoot, "cardC", "DSC09009.ARW"))
          open(os.path.join(shoot, "cardC", "DSC09009.JPG"), "wb").write(data)  # a RAW + JPEG pair
          EOF

      - name: Open the app like a double-click, and cull through its API
        run: |
          open --env PHOTOCULL_NO_BROWSER=1 "$RUNNER_TEMP/Applications/Photo Cull.app"
          python3 tests/ci_check.py "$RUNNER_TEMP/shoot" "$RUNNER_TEMP/speed"

      - name: Photo Cull log
        if: always()
        run: cat "$HOME/Library/Logs/Photo Cull.log" || true

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-15'
        with:
          name: PhotoCull-mac
          path: dist/PhotoCull-mac.zip

  windows-dev:
    # The development setup on Windows: same code, unit tests.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - run: uv run pytest -q

  release:
    # A v* tag that passes the Mac tests publishes the zip, and install.sh for the Update button, as a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac-install, windows-dev]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PhotoCull-mac
      - env:
          GH_TOKEN: ${{ github.token }}
          NOTES: >-
            New install: download PhotoCull-mac.zip, unzip it and double-click Install Photo Cull
            (Read me first explains the one-time 'Open Anyway' step). Already installed: click Update in Photo Cull.
        run: gh release create "$GITHUB_REF_NAME" PhotoCull-mac.zip install.sh --title "Photo Cull $GITHUB_REF_NAME" --notes "$NOTES"

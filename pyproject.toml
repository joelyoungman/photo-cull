[project]
name = "photo-cull"
version = "0.1.9"
description = "Pick the best photos from one shoot, quickly. Local, no cloud."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Upper bounds: a major version could rename what we use (MediaPipe has before). uv.lock pins the exact set.
dependencies = [
    "numpy>=2,<3",
    "pillow>=11,<14",
    "pillow-heif>=0.20,<2",
    "rawpy>=0.24,<1",
    "mediapipe>=1.2,<2",  # brings opencv-contrib-python (YuNet face detector lives in cv2 too)
    "exifread>=3,<4",
    "starlette>=0.40,<2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

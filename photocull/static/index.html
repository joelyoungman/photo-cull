<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Cull</title>
<style>
:root {
  --bg: #111214; --panel: #1b1c1f; --panel2: #24262a; --line: #33363b; --text: #e8e8ea; --muted: #9a9ca3;
  --accent: #5b9dff; --best: #2fb36f; --pick: #2fb36f; --reject: #e5534b; --warn: #f2c14e; --star: #f2c14e;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: #555a62; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.on { border-color: var(--accent); color: #fff; background: #23344f; }
button.danger { border-color: #6b2b28; color: #ffb3ae; }
select, input[type=text] { font: inherit; color: var(--text); background: #0d0e10; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
kbd { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; }
.hidden { display: none !important; }

header { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
header .title { font-weight: 700; }
header .folder { color: var(--muted); max-width: 26vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header .spacer { flex: 1; }
#progress { color: var(--muted); font-size: 13px; white-space: nowrap; }
#progress .bar { display: inline-block; vertical-align: middle; width: 120px; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-right: 6px; }
#progress .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
#counts { color: var(--muted); font-size: 13px; white-space: nowrap; }
#counts b { color: var(--text); }

#start { position: absolute; inset: 52px 0 0 0; display: flex; align-items: center; justify-content: center; }
#start .box { width: min(560px, 92vw); text-align: center; }
#start h1 { font-size: 26px; margin: 0 0 6px; }
#start p { color: var(--muted); margin: 0 0 20px; }
#start .big { font-size: 17px; padding: 12px 26px; }
#start .recent { margin-top: 28px; text-align: left; }
#start .recent h2 { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
#start .recent button { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; }
#start .recent small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#start .typed { margin-top: 18px; display: flex; gap: 8px; }
#start .typed input { flex: 1; }

#work { position: absolute; inset: 52px 0 0 0; display: grid; grid-template-columns: 1fr 300px; }
#stage { position: relative; display: grid; grid-template-rows: 1fr auto auto; min-width: 0; min-height: 0; }
#viewer { position: relative; overflow: hidden; background: #0a0a0b; min-height: 0; display: flex; align-items: center; justify-content: center; }
#viewer img.main { max-width: 100%; max-height: 100%; object-fit: contain; display: block; user-select: none; }
#viewer.zoom { cursor: move; display: block; }
#viewer.zoom img.main { max-width: none; max-height: none; position: absolute; }
#boxes { position: absolute; pointer-events: none; }
#focus { position: absolute; pointer-events: none; display: none; }
#viewer.showfocus #focus { display: block; }
.badge.sharp { pointer-events: auto; cursor: help; }
#boxes div { position: absolute; border: 2px solid rgba(47,179,111,.9); border-radius: 4px; }
#boxes div.shut { border-color: var(--reject); }
#boxes div.bg { border-style: dashed; border-width: 1px; }
#boxes div { pointer-events: auto; cursor: pointer; }
#boxes div:hover { border-color: var(--warn); border-width: 3px; }
.badge.excluded { background: var(--reject); color: #fff; font-weight: 700; }
.matches { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; max-height: 50vh; overflow: auto; margin: 10px 0; }
.matches label { display: block; background: var(--panel2); border-radius: 8px; padding: 6px; text-align: center; font-size: 12px; color: var(--muted); cursor: pointer; }
.matches img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; display: block; margin-bottom: 4px; }
.matches input { accent-color: var(--reject); }
.badges { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.badge { background: rgba(0,0,0,.72); border-radius: 6px; padding: 4px 9px; font-size: 13px; }
.badge.best { background: var(--best); color: #fff; font-weight: 600; }
.badge.problem { background: rgba(120,25,22,.9); color: #ffd2cf; }
.badge.pick { background: var(--pick); color: #fff; font-weight: 700; }
.badge.reject { background: var(--reject); color: #fff; font-weight: 700; }
.badge.stars { color: var(--star); letter-spacing: 1px; }
#info { padding: 7px 14px; color: var(--muted); font-size: 13px; background: var(--panel); border-top: 1px solid var(--line); display: flex; gap: 16px; flex-wrap: wrap; }
#info b { color: var(--text); font-weight: 600; }
#strip { display: flex; gap: 6px; padding: 8px 10px; background: var(--panel); border-top: 1px solid var(--line); overflow-x: auto; min-height: 104px; align-items: center; }
#strip .label { color: var(--muted); font-size: 12px; writing-mode: vertical-rl; transform: rotate(180deg); }

.thumb { position: relative; flex: none; width: 128px; height: 86px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; background: #000; cursor: pointer; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.cur { border-color: var(--accent); }
.thumb.multi::before { content: "✓"; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  border: 4px solid var(--warn); border-radius: 4px; background: rgba(242, 193, 78, .28);
  color: #111; font-weight: 800; font-size: 14px; display: flex; align-items: flex-start; justify-content: flex-end; padding: 2px 6px; }
.thumb.multi.cur::before { border-color: var(--accent); }
#versionBtn { background: none; border: none; color: var(--muted); font-size: 12px; padding: 4px 6px; }
#versionBtn:hover { color: var(--text); }
#counts .selcount { color: var(--warn); font-weight: 600; }
.thumb.best::after { content: "★ best"; position: absolute; top: 3px; left: 3px; background: var(--best); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }
.thumb .flag { position: absolute; bottom: 3px; right: 3px; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; color: #fff; }
.thumb .flag.pick { background: var(--pick); }
.thumb .flag.reject { background: var(--reject); }
.thumb.rejected img { opacity: .35; }
.thumb .warn { position: absolute; top: 3px; right: 3px; background: rgba(120,25,22,.9); color: #ffd2cf; font-size: 10px; padding: 1px 5px; border-radius: 4px; }
.thumb .sharpnum { position: absolute; bottom: 3px; right: 3px; color: #fff; font-size: 10px; background: rgba(0,0,0,.6); padding: 0 4px; border-radius: 4px; }
.thumb .flag ~ .sharpnum { right: 52px; }
.thumb .stars { position: absolute; bottom: 3px; left: 3px; color: var(--star); font-size: 10px; background: rgba(0,0,0,.6); padding: 0 4px; border-radius: 4px; }

#side { border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
#side .controls { padding: 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
#side .controls .row { display: flex; gap: 6px; }
#side .controls .row > * { flex: 1; }
#list { overflow-y: auto; padding: 8px; }
#list .group { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 6px; margin-bottom: 8px; border-radius: 8px; background: #151618; }
#list .group.multi { background: #1c2230; }
#list .group .ghead { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
#list .thumb { width: 100%; height: 82px; }
#side .bottom { padding: 10px; border-top: 1px solid var(--line); display: grid; gap: 8px; }

#compare { position: absolute; inset: 0; background: #0a0a0b; display: grid; gap: 6px; padding: 6px; z-index: 3; }
#compare .cell { position: relative; overflow: hidden; border: 3px solid transparent; border-radius: 6px; background: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; min-height: 0; }
#compare .cell img { max-width: 100%; max-height: 100%; object-fit: contain; }
#compare .cell.cur { border-color: var(--accent); }
#compare .cell .badges { top: 6px; left: 6px; }

#grid { position: absolute; inset: 0; background: var(--bg); overflow-y: auto; padding: 10px; z-index: 3; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; align-content: start; }
#grid .thumb { width: 100%; height: 130px; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 10; }
.modal .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; width: min(620px, 94vw); max-height: 86vh; overflow: auto; }
.modal h2 { margin: 0 0 10px; font-size: 18px; }
.modal ul { margin: 8px 0; padding-left: 20px; max-height: 40vh; overflow: auto; color: var(--muted); }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.modal table { border-collapse: collapse; width: 100%; }
.modal td { padding: 4px 6px; vertical-align: top; }
.modal td:first-child { white-space: nowrap; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>
<header>
  <span class="title">Photo Cull</span>
  <span class="folder" id="folderName"></span>
  <button id="chooseBtn">Choose shoot…</button>
  <button id="rescanBtn" class="hidden" title="Look in the shoot folder for photos added since (also happens by itself when you come back to this page)">Check for new photos</button>
  <span class="spacer"></span>
  <span id="progress"></span>
  <span id="counts"></span>
  <button id="versionBtn" title="Check for updates"></button>
  <button id="updateBtn" class="primary hidden" title="A newer Photo Cull is available">Update</button>
  <button id="helpBtn" title="Keyboard shortcuts (?)">?</button>
  <button id="quitBtn" title="Stop Photo Cull">Quit</button>
</header>

<section id="start" class="hidden">
  <div class="box">
    <h1>Which shoot are we culling?</h1>
    <p>Choose the folder of one job. Photo Cull looks at every photo in it (and its sub-folders), groups bursts and look-alikes, and suggests the best of each group. Your originals are never changed.</p>
    <button class="primary big" id="chooseBig">Choose shoot folder…</button>
    <div class="typed"><input type="text" id="typedPath" placeholder="…or paste a folder path here"><button id="typedGo">Open</button></div>
    <div class="recent hidden" id="recentBox"><h2>Recent shoots</h2><div id="recent"></div></div>
  </div>
</section>

<section id="work" class="hidden">
  <div id="stage">
    <div id="viewer">
      <img class="main" id="mainImg" alt="">
      <img id="focus" alt="">
      <div id="boxes"></div>
      <div class="badges" id="badges"></div>
      <div id="compare" class="hidden"></div>
      <div id="grid" class="hidden"></div>
    </div>
    <div id="info"></div>
    <div id="strip"></div>
  </div>
  <aside id="side">
    <div class="controls">
      <div class="row">
        <button id="modeAll" class="on" title="Every photo">All photos</button>
        <button id="modeBest" title="Only the suggested best of each group, plus photos on their own">Best of each</button>
      </div>
      <select id="order" title="Order">
        <option value="time">Order: as taken (groups together)</option>
        <option value="sharp">Order: sharpest first</option>
      </select>
      <select id="filter" title="Show only…">
        <option value="all">Show: everything</option>
        <option value="unmarked">Not decided yet</option>
        <option value="pick">Picks</option>
        <option value="reject">Rejects</option>
        <option value="rated">Rated 3★ and up</option>
        <option value="problems">Possible problems</option>
        <option value="eyes">Eyes closed</option>
        <option value="blurry">Blurry / out of focus</option>
      </select>
      <div class="row">
        <button id="compareBtn" title="Compare the group side by side (C)">Compare <kbd>C</kbd></button>
        <button id="gridBtn" title="Grid of all photos (G)">Grid <kbd>G</kbd></button>
      </div>
      <div class="row">
        <button id="focusBtn" title="Show which parts of the photo are in focus: they glow green (S)">Focus <kbd>S</kbd></button>
        <button id="facesBtn" title="Show the faces found; red = eyes closed (F)">Faces <kbd>F</kbd></button>
      </div>
    </div>
    <div id="list"></div>
    <div class="bottom">
      <label style="color:var(--muted);font-size:13px"><input type="checkbox" id="advance" checked> Move to next photo after P / X</label>
      <button class="primary" id="selectsBtn">Copy picks to Selects…</button>
      <div class="row" style="display:flex;gap:6px">
        <button id="selectsFolderBtn" style="flex:1" title="Show the Selects folder in Finder">Open Selects folder</button>
        <button id="selectsPsBtn" style="flex:1" title="Open the copies in Selects in Photoshop (RAW opens in Camera Raw)">Picks in Photoshop</button>
      </div>
      <div class="row" style="display:flex;gap:6px">
        <button id="excludeBtn" style="flex:1" title="Someone asked not to be in any photos: find them and mark their photos X">Exclude a person…</button>
        <button id="peopleBtn" class="hidden" style="flex:1" title="People excluded from this shoot">Excluded (0)</button>
      </div>
      <button id="deletesBtn" class="danger" title="Move the photos marked X into a Deletes folder in this shoot. Nothing is deleted.">Move rejects to Deletes…</button>
      <button id="putBackBtn" class="hidden" title="Move everything Photo Cull put in Deletes back where it came from">Put back from Deletes</button>
    </div>
  </aside>
</section>

<div class="modal hidden" id="modal"><div class="card" id="modalCard"></div></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const H = {"Content-Type": "application/json", "X-Photo-Cull": "1"};
let data = {shots: [], path: null};
let view = [];          // shots in the order shown, after mode + filter
let cur = 0;            // index into view
let mode = "all";       // all | best
let overlay = null;     // null | compare | grid
let compareSel = 0;
let zoom = false, showBoxes = false, showFocus = false;
let lastProgress = null;
let sel = new Set();     // keys selected with the mouse (click, Cmd/Ctrl-click, Shift-click) or Shift+arrows
let anchorKey = null;    // where a Shift-click range starts

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: H, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function img(key, size) { return "/img?size=" + size + "&key=" + encodeURIComponent(key); }
function stars(n) { return n ? "★".repeat(n) : ""; }

// ---------- start screen ----------
async function refreshStatus() {
  const s = await api("/api/status");
  if (!s.job) {
    $("start").classList.remove("hidden"); $("work").classList.add("hidden"); $("folderName").textContent = "";
    $("recent").replaceChildren();
    for (const r of s.recent) {
      const b = el("button"); b.append(el("span", "", r.name), el("small", "", r.path));
      b.onclick = () => openPath(r.path);
      $("recent").append(b);
    }
    $("recentBox").classList.toggle("hidden", !s.recent.length);
    return false;
  }
  if ($("work").classList.contains("hidden") && !$("start").classList.contains("hidden")) await opened();  // opened in another tab
  return true;
}
async function choose() {
  $("chooseBtn").disabled = $("chooseBig").disabled = true;
  try {
    const r = await api("/api/choose", {});
    if (!r.cancelled) await opened();
  } catch (e) { alert("Couldn't open that folder: " + e.message); }
  finally { $("chooseBtn").disabled = $("chooseBig").disabled = false; }
}
async function openPath(path) {
  try { await api("/api/open", {path}); await opened(); }
  catch (e) { alert("Couldn't open that folder: " + e.message); }
}
async function opened() {
  $("start").classList.add("hidden"); $("work").classList.remove("hidden"); $("rescanBtn").classList.remove("hidden");
  cur = 0; data = {shots: []};
  await load(true);
}

// ---------- data ----------
async function load(first) {
  const keep = view[cur] && view[cur].key;
  const d = await api("/api/shots");
  const otherShoot = data.path && d.path !== data.path;  // a shoot was opened in another tab
  data = d;
  if (otherShoot) { cur = 0; sel = new Set(); anchorKey = null; first = true; }
  $("folderName").textContent = d.path;
  $("putBackBtn").textContent = "Put back from Deletes (" + d.in_deletes + ")";
  $("peopleBtn").textContent = "Excluded (" + (d.excluded_people || 0) + ")";
  $("peopleBtn").classList.toggle("hidden", !d.excluded_people);
  $("putBackBtn").classList.toggle("hidden", !d.in_deletes);
  showProgress(d.progress);
  rebuild(keep);
  if (first) render();
}
function showProgress(p) {
  lastProgress = p;
  const box = $("progress"); box.replaceChildren();
  if (p.phase === "analysing" || p.phase === "scanning") {
    const bar = el("span", "bar"); const fill = el("i"); bar.append(fill);
    fill.style.width = (p.total ? 100 * p.done / p.total : 0) + "%";
    box.append(bar, p.phase === "scanning" ? "Looking for photos…" :
      (p.downloading ? "Downloading from Google Drive… " : "Analysing ") + p.done + " / " + p.total);
  } else if (p.phase === "failed") {
    box.append("Analysis stopped: " + p.current);
  } else if (p.phase === "done" && p.errors) {
    box.append(p.errors + " couldn't be read");
  }
}
function matches(s, f) {
  if (f === "all") return true;
  if (f === "unmarked") return !s.flag;
  if (f === "pick") return s.flag === "pick";
  if (f === "reject") return s.flag === "reject";
  if (f === "rated") return s.rating >= 3;
  const p = s.problems || [];
  if (f === "problems") return p.length > 0 || !!s.error;
  if (f === "eyes") return p.some(x => x.startsWith("eyes closed"));
  if (f === "blurry") return p.includes("blurry") || p.includes("faces out of focus");
  return true;
}
function rebuild(keepKey) {
  const f = $("filter").value;
  view = data.shots.filter(s => (mode === "all" || s.suggested || s.group_size === 1 || s.group == null) && matches(s, f));
  if ($("order").value === "sharp") view = [...view].sort((a, b) => (b.sharp_score ?? -1) - (a.sharp_score ?? -1));
  const i = keepKey ? view.findIndex(s => s.key === keepKey) : -1;
  cur = i >= 0 ? i : Math.min(cur, Math.max(0, view.length - 1));
  renderList(); renderCounts();
  if (!keepKey || i < 0) render(); else { renderStrip(); renderBadges(); }
}
function groupOf(s) { return s && s.group != null ? data.shots.filter(x => x.group === s.group) : (s ? [s] : []); }
function renderCounts() {
  const picks = data.shots.filter(s => s.flag === "pick").length;
  const rejects = data.shots.filter(s => s.flag === "reject").length;
  const groups = new Set(data.shots.filter(s => s.group_size > 1).map(s => s.group)).size;
  const c = $("counts"); c.replaceChildren();
  const b = t => el("b", "", String(t));
  c.append(b(data.shots.length), " photos · ", b(groups), " groups · ", b(picks), " picks · ", b(rejects), " rejects");
  if (sel.size > 1) c.append(" · ", el("span", "selcount", sel.size + " selected"));
}

// ---------- rendering ----------
function thumbEl(s, isCur) {
  const t = el("div", "thumb" + (isCur ? " cur" : "") + (s.suggested ? " best" : "") + (s.flag === "reject" ? " rejected" : "") + (sel.size > 1 && sel.has(s.key) ? " multi" : ""));
  if (!s.error) { const i = el("img"); i.loading = "lazy"; i.src = img(s.key, "s"); i.alt = s.name; t.append(i); }
  else t.append(el("div", "warn", "can't read"));
  if (s.flag) t.append(el("span", "flag " + s.flag, s.flag === "pick" ? "PICK" : "REJECT"));
  if (s.rating) t.append(el("span", "stars", stars(s.rating)));
  if (s.sharp_score != null) t.append(el("span", "sharpnum", String(s.sharp_score)));
  if ((s.problems || []).length && !s.suggested) t.append(el("span", "warn", "!"));
  t.title = s.name + ((s.problems || []).length ? " — " + s.problems.join(", ") : "");
  return t;
}
function renderList() {
  const list = $("list"); list.replaceChildren();
  if (!view.length) { list.append(el("div", "empty", data.shots.length ? "Nothing matches this filter." : "No photos analysed yet…")); return; }
  let box = null, lastGroup = undefined;
  view.forEach((s, i) => {
    if (s.group !== lastGroup || s.group == null) {
      box = el("div", "group" + (s.group_size > 1 ? " multi" : ""));
      if (s.group_size > 1) box.append(el("div", "ghead", "Group of " + s.group_size));
      list.append(box); lastGroup = s.group;
    }
    const t = thumbEl(s, i === cur); t.dataset.i = i;
    t.onclick = e => clickThumb(i, e);
    box.append(t);
  });
  const c = list.querySelector(".thumb.cur"); if (c) c.scrollIntoView({block: "nearest"});
}
function renderBadges() {
  const s = view[cur]; const b = $("badges"); b.replaceChildren();
  if (!s) return;
  b.append(...badgesFor(s));
}
function badgesFor(s) {
  const out = [];
  if (s.flag === "pick") out.push(el("span", "badge pick", "PICK"));
  if (s.flag === "reject") out.push(el("span", "badge reject", "REJECT"));
  if (s.rating) out.push(el("span", "badge stars", stars(s.rating)));
  if (s.sharp_score != null) {
    const b = el("span", "badge sharp", "Sharpness " + s.sharp_score);
    b.style.borderLeft = "4px solid " + (s.sharp_score >= 67 ? "var(--best)" : s.sharp_score >= 34 ? "var(--warn)" : "var(--reject)");
    b.title = "Sharper than " + s.sharp_score + "% of this shoot" + (s.main_faces ? ", judged on the faces" : "") + ". Hover (or press S) to see which parts are in focus: they glow green.";
    b.onmouseenter = () => setFocusOverlay(true, true); b.onmouseleave = () => setFocusOverlay(showFocus, true);
    out.push(b);
  }

  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$("modal").classList.contains("hidden")) { if (e.key === "Escape") closeModal(); return; }
  if ($("work").classList.contains("hidden")) return;
  const k = e.key.toLowerCase();
  if (overlay === "compare" && (k === "arrowleft" || k === "arrowright")) {
    const g = groupOf(view[cur]); compareSel = (compareSel + (k === "arrowright" ? 1 : g.length - 1)) % g.length;
    const j = view.findIndex(v => v.key === g[compareSel].key); if (j >= 0) { cur = j; render(); } else renderCompare();
    e.preventDefault(); return;
  }
  const act = {
    arrowright: () => go(cur + 1, e.shiftKey), arrowleft: () => go(cur - 1, e.shiftKey), arrowdown: () => goGroup(1), arrowup: () => goGroup(-1),
    " ": () => go(cur + 1),
    p: () => mark({flag: "pick"}), x: () => mark({flag: "reject"}), u: () => mark({flag: ""}),
    0: () => mark({rating: 0}), 1: () => mark({rating: 1}), 2: () => mark({rating: 2}), 3: () => mark({rating: 3}), 4: () => mark({rating: 4}), 5: () => mark({rating: 5}),
    c: () => toggleOverlay("compare"), g: () => toggleOverlay("grid"), z: () => setZoom(!zoom),
    f: () => toggleFaces(), b: () => setMode(mode === "all" ? "best" : "all"),
    s: () => setFocusOverlay(!showFocus),
    o: () => openFile("photoshop"), r: () => openFile("reveal"), "?": help,
    escape: () => { if (zoom) setZoom(false); else if (sel.size > 1) { sel = new Set(view[cur] ? [view[cur].key] : []); render(); renderCounts(); } else if (overlay) toggleOverlay(overlay); },
    enter: () => { if (overlay === "grid") toggleOverlay(null); },
  }[k];
  if (act) { e.preventDefault(); act(); }
});

// ---------- updates ----------
async function checkUpdate(force) {
  const v = $("versionBtn");
  if (force) v.textContent = "Checking…";
  try {
    const u = await api("/api/update" + (force ? "?force=1" : ""));
    v.textContent = "v" + u.current;
    if (u.available) { $("updateBtn").textContent = "Update to " + u.latest; $("updateBtn").classList.remove("hidden"); $("updateBtn").dataset.latest = u.latest; }
    else if (force) { v.textContent = "v" + u.current + (u.latest ? " · up to date" : " · couldn't check (offline?)"); setTimeout(() => { v.textContent = "v" + u.current; }, 5000); }
  } catch (e) { if (force) v.textContent = "couldn't check"; }
}
$("versionBtn").onclick = () => checkUpdate(true);
// Photo Cull may stay open for days: look again every half hour, and whenever she comes back to the page.
setInterval(() => checkUpdate(false), 30 * 60 * 1000);
window.addEventListener("focus", () => checkUpdate(false));
function updateNow() {
  const latest = $("updateBtn").dataset.latest;
  modal(c => {
    c.append(el("h2", "", "Update Photo Cull to " + latest + "?"));
    c.append(el("p", "", "Photo Cull closes, downloads the new version and opens again by itself. It takes a minute or two. Your stars and picks are kept, and your photos aren't touched."));
    const a = el("div", "actions");
    const cancel = el("button", "", "Not now"); cancel.onclick = closeModal;
    const go = el("button", "primary", "Update");
    go.onclick = async () => {
      go.disabled = true;
      try { await api("/api/update", {}); } catch (e) { go.textContent = "Couldn't start: " + e.message; return; }
      document.body.replaceChildren(el("div", "empty", "Updating Photo Cull… this page reopens by itself in a minute or two. Please leave it open."));
      const started = Date.now();
      const poll = setInterval(async () => {
        try {
          const r = await fetch("/api/ping"); const p = await r.json();
          if (p.version === latest) { clearInterval(poll); location.reload(); }
        } catch (e) {}
        if (Date.now() - started > 10 * 60 * 1000) {
          clearInterval(poll);
          document.body.replaceChildren(el("div", "empty", "The update is taking longer than expected. Open Photo Cull again from Applications. If that doesn't work, tell Joel."));
        }
      }, 3000);
    };
    a.append(cancel, go); c.append(a);
  });
}
$("updateBtn").onclick = updateNow;
checkUpdate();

$("chooseBtn").onclick = choose; $("chooseBig").onclick = choose;
$("typedGo").onclick = () => { const p = $("typedPath").value.trim(); if (p) openPath(p); };
$("typedPath").addEventListener("keydown", e => { if (e.key === "Enter") $("typedGo").click(); });
$("modeAll").onclick = () => setMode("all"); $("modeBest").onclick = () => setMode("best");
$("filter").onchange = () => { rebuild(view[cur] && view[cur].key); render(); };
$("order").onchange = () => { rebuild(view[cur] && view[cur].key); render(); };
$("compareBtn").onclick = () => toggleOverlay("compare");
$("focusBtn").onclick = () => setFocusOverlay(!showFocus); $("facesBtn").onclick = toggleFaces; $("gridBtn").onclick = () => toggleOverlay("grid");
$("selectsBtn").onclick = selects; $("helpBtn").onclick = help;
$("selectsFolderBtn").onclick = openSelectsFolder;
$("deletesBtn").onclick = moveRejects;
$("excludeBtn").onclick = excludeIntro; $("peopleBtn").onclick = showExcluded; $("putBackBtn").onclick = putBack;
$("selectsPsBtn").onclick = () => openInPhotoshop(sel.size > 1 ? selectedKeys() : pickKeys());
$("quitBtn").onclick = async () => { if (confirm("Stop Photo Cull? Your marks are saved; open the app again to carry on.")) { await api("/api/quit", {}).catch(() => {}); document.body.replaceChildren(el("div", "empty", "Photo Cull has stopped. You can close this tab.")); } };
window.addEventListener("resize", () => { renderBoxes(); setFocusOverlay(showFocus); });
$("mainImg").addEventListener("load", () => setFocusOverlay(showFocus));

// Photos added to the shoot folder later: look for them when she comes back to this page (at most every 30 s),
// or when she clicks "Check for new photos". Only new or changed photos are analysed; marks stay.
let lastScan = Date.now();
async function rescan() {
  lastScan = Date.now();
  try { await api("/api/reanalyse", {}); await load(false); } catch (e) {}
}
$("rescanBtn").onclick = rescan;
window.addEventListener("focus", async () => {
  // Coming back to this tab: show marks made in another tab (or another shoot opened there), and look for new photos.
  if (!(await refreshStatus())) return;
  const p = lastProgress;
  if (Date.now() - lastScan > 30000 && !(p && (p.phase === "analysing" || p.phase === "scanning"))) rescan();
  else { try { await load(false); render(); } catch (e) {} }
});

// While analysis runs, refresh every couple of seconds so photos appear as they're done.
setInterval(async () => {
  if ($("work").classList.contains("hidden")) return;
  const p = lastProgress;
  if (p && (p.phase === "analysing" || p.phase === "scanning")) { try { await load(false); } catch (e) {} }
}, 2500);

(async () => { if (await refreshStatus()) await opened(); })();
</script>
